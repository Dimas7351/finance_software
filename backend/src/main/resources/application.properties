spring.application.name=finance_application

spring.datasource.url=jdbc:postgresql://localhost:5435/finance_software_db
#if needed change the username
spring.datasource.username=postgres
# create the DB (inside database folder) and then change the password to your name
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# for ignoring flyway Database
#spring.flyway.baseline-on-migrate=true
spring.flyway.url=jdbc:postgresql://localhost:5435/finance_software_db
spring.flyway.user=postgres
spring.flyway.password=postgres
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --for logging sql queries--
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

